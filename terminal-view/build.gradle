plugins {
    id 'com.android.library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace = "com.termux.view"
    compileSdk {
        version = release(providers.gradleProperty("compileSdkVersion").get().toInteger()) {
            minorApiLevel = providers.gradleProperty("compileSdkMinorVersion").get().toInteger()
        }
    }
    buildToolsVersion = providers.gradleProperty("buildToolsVersion").get()

    defaultConfig {
        minSdk = providers.gradleProperty("minSdkVersion").get().toInteger()
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.annotation:annotation:$annotationVersion"
    api project(":terminal-emulator")
    testImplementation "junit:junit:4.13.2"
}
