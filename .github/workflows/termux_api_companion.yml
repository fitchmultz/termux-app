name: Termux API companion

on:
  pull_request:
    branches: ['fold/main']
    paths:
      - '.github/workflows/termux_api_companion.yml'
      - 'docs/TERMUX_API_COMPANION.md'
      - 'FORK_CHANGES.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      sign_companion:
        description: Sign the verified companion with the existing Fold key (fold/main only; no publication or installation)
        required: true
        default: false
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: api-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# These are reviewed workflow code, never downloaded scripts or artifact-provided policy.
# Signing receives reviewed policy, never artifact-provided scripts.
# The self-hosted VM persists; each job uses its own container and temporary directories.
env:
  SHELL: /bin/bash
  API_SOURCE_COMMIT: 6c8eaa223bcc387e6b28146d340acb20712aa3e7
  API_SOURCE_TREE: f7262e96f32bb63c654396a1adc370c89395bec8
  SOURCE_DATE_EPOCH: '1756768574'
  WORKFLOW_COMMIT: ${{ github.sha }}
  WORKFLOW_RUN_ID: ${{ github.run_id }}
  WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
  CANDIDATE_CONTRACT: >-
    {"schema":3,"source_repository":"https://github.com/termux/termux-api",
    "source_tag":"v0.53.0","source_commit":"6c8eaa223bcc387e6b28146d340acb20712aa3e7",
    "source_tree":"f7262e96f32bb63c654396a1adc370c89395bec8","source_date_epoch":1756768574,
    "package":"com.termux.api","shared_user_id":"com.termux","version_name":"0.53.0",
    "version_code":1002,"min_sdk":24,"target_sdk":28,"compile_sdk":35,
    "debuggable":false,"native_libraries":[],"build_variant":"release",
    "agp":"8.7.3","gradle":"8.9","gradle_distribution":"gradle-8.9-all.zip",
    "gradle_distribution_sha256":"258e722ec21e955201e31447b0aed14201765a3bfbae296a46cf60b70e66db70",
    "upstream_wrapper_sha256":"e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637",
    "upstream_wrapper_properties_sha256":"c4fcac9a6f994b73c3e402d75ad6bd07d51b66ee01e935663a3388b2c034bd37",
    "java_major":21,"java_source_target":11,"runner":"self-hosted/Linux/ARM64",
    "execution":{"os":"ubuntu-24.04","platform":"linux/amd64",
    "image":"ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac",
    "java_architecture":"x64"},
    "compile_build_tools":"34.0.0","verification_build_tools":"37.0.0",
    "sdk_command_line_tools":"16111833","unsigned_filename":"termux-api-unsigned.apk",
    "clean_builds":2,"byte_identical":true,"resolution":"exclusive-round-local-maven-with-aar-hash-audit",
    "source_dependencies":{
    "shared":{"repository":"https://github.com/termux/termux-app",
    "commit":"7bceab88e2272f961d1b94ef736f1a9e20173247","tree":"e982c267beddd24e389f6a4cee378dfc09f5f605",
    "epoch":1750867852,"agp":"4.2.2","group":"com.termux.termux-app","version":"7bceab88e2"},
    "am":{"repository":"https://github.com/termux/termux-am-library",
    "commit":"d979ee308d52c59c6265ed9d9e254c97702ee4fb","tree":"f986157b9b588f527825c924623811149cb03ee8",
    "epoch":1650918843,"agp":"7.0.3","group":"com.termux","version":"v2.0.0"}},
    "legacy_recipe":{"java_major":11,"java_source_target":8,"gradle":"7.2","compile_sdk":30,
    "min_sdk":21,"target_sdk":28,"build_tools":"30.0.2","ndk":"21.1.6352462",
    "gradle_distribution_sha256":"a8da5b02437a60819cad23e10fc7e9cf32bcb57029d9cb277e26eeff76ce014b",
    "wrapper_sha256":"e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637",
    "wrapper_properties_sha256":"cc162bed9654746905008154a8e69de28b28316f1b6c146bbfd1fcd13f554cfa"}}
  LIBRARY_SETTINGS: |
    include ':termux-shared', ':terminal-view', ':terminal-emulator'
  PUBLISH_INIT: |
    // Publication identity/output only; the pinned components own all artifacts and dependency metadata.
    gradle.beforeProject { p ->
        p.group = System.getenv('SOURCE_GROUP')
        p.version = System.getenv('SOURCE_VERSION')
    }
    gradle.projectsEvaluated {
        def root = gradle.rootProject
        def modules = System.getenv('SOURCE_GROUP') == 'com.termux' ?
            ['termux-am-library'] : ['termux-shared', 'terminal-view', 'terminal-emulator']
        if (root.allprojects*.path.toSet() != ([':'] + modules.collect { ':' + it }).toSet()) {
            throw new GradleException('Unexpected producer projects; main app must not be included')
        }
        modules.each { name ->
            def p = root.project(':' + name)
            def publication = p.publishing.publications.getByName('release')
            publication.groupId = System.getenv('SOURCE_GROUP')
            publication.artifactId = name
            publication.version = System.getenv('SOURCE_VERSION')
            p.publishing.repositories.maven { repository ->
                repository.name = 'Companion'
                repository.url = p.uri(System.getenv('COMPANION_MAVEN_REPO'))
            }
        }
    }
  LOCAL_REPOSITORY_INIT: |
    import org.gradle.api.artifacts.component.ModuleComponentIdentifier
    import org.gradle.api.attributes.Attribute
    // No user mavenLocal, remote fallback, or version substitution for these source-built modules.
    def modules = ['com.termux:termux-am-library:v2.0.0']
    if (System.getenv('COMPANION_CONSUMER') == 'api') {
        modules += ['termux-shared', 'terminal-view', 'terminal-emulator'].collect {
            'com.termux.termux-app:' + it + ':7bceab88e2'
        }
    }
    def repo = new File(System.getenv('COMPANION_MAVEN_REPO'))
    gradle.beforeProject { p ->
        p.repositories.exclusiveContent {
            forRepository { p.repositories.maven { name = 'CompanionSources'; url = p.uri(repo) } }
            filter { modules.each { gav -> def c = gav.split(':'); includeModule(c[0], c[1]) } }
        }
    }
    gradle.projectsEvaluated {
        def root = gradle.rootProject
        root.tasks.register('companionSourceResolution') {
            doLast {
                def project = root.project(System.getenv('COMPANION_CONSUMER') == 'api' ? ':app' : ':termux-shared')
                def configuration = project.configurations.getByName('releaseRuntimeClasspath')
                def sourceComponent = { id ->
                    id instanceof ModuleComponentIdentifier && id.group in ['com.termux', 'com.termux.termux-app']
                }
                // Check identities separately: an AAR view may omit components with no matching artifact.
                def sourceGavs = configuration.incoming.resolutionResult.allComponents.collect { it.id }
                    .findAll(sourceComponent).collect { id -> id.group + ':' + id.module + ':' + id.version }
                if (sourceGavs.sort() != modules.sort()) throw new GradleException('Unexpected source dependency graph: ' + sourceGavs)
                def artifactType = Attribute.of('artifactType', String)
                def artifacts = configuration.incoming.artifactView { view ->
                    view.attributes.attribute(artifactType, 'aar')
                    view.componentFilter(sourceComponent)
                }.artifacts.artifacts
                def found = []
                artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    def gav = id.group + ':' + id.module + ':' + id.version
                    // ResolvedArtifactResult has no public classifier field; require the unclassified raw filename.
                    def filename = id.module + '-' + id.version + '.aar'
                    if (!(gav in modules) || artifact.variant.attributes.getAttribute(artifactType) != 'aar' ||
                        artifact.file.name != filename) {
                        throw new GradleException('Unexpected source artifact: ' + gav + ' ' + artifact.file.name)
                    }
                    def input = new File(repo, id.group.replace('.', '/') + '/' + id.module + '/' + id.version + '/' + filename)
                    def sha = { file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
                    if (sha(artifact.file) != sha(input)) throw new GradleException('Source AAR hash mismatch: ' + gav)
                    found += gav
                    println('source_resolution=' + gav + ' sha256=' + sha(input))
                }
                if (found.sort() != modules.sort()) throw new GradleException('Incomplete source dependency graph')
            }
        }
    }
  SDK_TOOL_FILES: >-
    ["platforms/android-30/android.jar","platforms/android-35/android.jar",
    "build-tools/30.0.2/aapt2","build-tools/34.0.0/aapt2","build-tools/37.0.0/aapt",
    "build-tools/37.0.0/zipalign","build-tools/37.0.0/lib/apksigner.jar",
    "cmdline-tools/16111833/bin/apkanalyzer","ndk/21.1.6352462/ndk-build",
    "ndk/21.1.6352462/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"]
  PUBLICATION_CONTRACT: >-
    {"com.termux:termux-am-library:v2.0.0":{"api":[],"runtime":[]},
    "com.termux.termux-app:terminal-emulator:7bceab88e2":{"api":[],"runtime":["androidx.annotation:annotation:1.3.0"]},
    "com.termux.termux-app:terminal-view:7bceab88e2":{"api":["com.termux.termux-app:terminal-emulator:7bceab88e2"],
    "runtime":["androidx.annotation:annotation:1.3.0","com.termux.termux-app:terminal-emulator:7bceab88e2"]},
    "com.termux.termux-app:termux-shared:7bceab88e2":{"api":[],"runtime":[
    "androidx.appcompat:appcompat:1.3.1","androidx.annotation:annotation:1.3.0","androidx.core:core:1.6.0",
    "com.google.android.material:material:1.4.0","com.google.guava:guava:24.1-jre",
    "io.noties.markwon:core:4.6.2","io.noties.markwon:ext-strikethrough:4.6.2","io.noties.markwon:linkify:4.6.2",
    "io.noties.markwon:recycler:4.6.2","org.lsposed.hiddenapibypass:hiddenapibypass:6.1",
    "androidx.window:window:1.0.0-alpha09","commons-io:commons-io:2.5",
    "com.termux.termux-app:terminal-view:7bceab88e2","com.termux:termux-am-library:v2.0.0"]}}
  PUBLICATION_INSPECTOR: |
    import hashlib, json, os, pathlib, stat, sys, zipfile
    import xml.etree.ElementTree as ET

    def require(ok, message):
        if not ok:
            raise SystemExit(message)

    repo = pathlib.Path(sys.argv[1])
    result = {}
    ns = {"m": "http://maven.apache.org/POM/4.0.0"}
    for gav, dependencies in json.loads(os.environ["PUBLICATION_CONTRACT"]).items():
        group, name, version = gav.split(":")
        directory = repo / group.replace(".", "/") / name / version
        stem = name + "-" + version
        files = {ext: directory / (stem + "." + ext) for ext in ("aar", "pom", "module")}
        records = {}
        for ext, path in files.items():
            st = path.lstat()
            require(stat.S_ISREG(st.st_mode) and 0 < st.st_size <= (32 * 1024 * 1024 if ext == "aar" else 65_536),
                    "Missing/oversized publication: " + gav)
            records[ext] = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "size": st.st_size}
        pom = ET.parse(files["pom"]).getroot()
        value = lambda key: pom.findtext("m:" + key, namespaces=ns)
        require((value("groupId"), value("artifactId"), value("version"), value("packaging")) ==
                (group, name, version, "aar"), "Wrong POM identity: " + gav)
        expected = {d: "compile" if d in dependencies["api"] else "runtime" for d in dependencies["runtime"]}
        actual = {}
        for dep in pom.findall("m:dependencies/m:dependency", ns):
            v = lambda key: dep.findtext("m:" + key, namespaces=ns)
            coordinate = ":".join(v(k) for k in ("groupId", "artifactId", "version"))
            require(coordinate not in actual and v("optional") in (None, "false"), "Duplicate/optional POM edge")
            actual[coordinate] = v("scope") or "compile"
        require(actual == expected, "POM graph/scope mismatch: " + gav)
        metadata = json.loads(files["module"].read_text())
        component = metadata["component"]
        require((component["group"], component["module"], component["version"]) == (group, name, version),
                "Wrong module identity: " + gav)
        usages = set()
        for variant in metadata["variants"]:
            usage = variant["attributes"]["org.gradle.usage"]
            require(usage in ("java-api", "java-runtime") and usage not in usages, "Unexpected publication variant")
            usages.add(usage)
            edges = [d["group"] + ":" + d["module"] + ":" + d["version"]["requires"]
                     for d in variant.get("dependencies", [])]
            require(sorted(edges) == sorted(dependencies["api" if usage == "java-api" else "runtime"])
                    and not variant.get("dependencyConstraints"), "Module dependency graph mismatch: " + gav)
            require(len(variant["files"]) == 1, "Unexpected module artifacts")
            artifact = variant["files"][0]
            require(artifact["name"] == artifact["url"] == stem + ".aar" and
                    artifact["size"] == records["aar"]["size"], "Wrong module artifact reference")
            for algorithm in ("sha256", "sha512", "sha1", "md5"):
                if algorithm in artifact:
                    require(hashlib.new(algorithm, files["aar"].read_bytes()).hexdigest() == artifact[algorithm],
                            "Module artifact digest mismatch")
            require(artifact.get("sha256") == records["aar"]["sha256"], "Missing module SHA256")
        require(usages == {"java-api", "java-runtime"}, "Incomplete release publication")
        with zipfile.ZipFile(files["aar"]) as archive:
            names = archive.namelist()
            require("AndroidManifest.xml" in names and "classes.jar" in names and archive.testzip() is None,
                    "Incomplete/corrupt AAR")
            library = {"termux-shared": "liblocal-socket.so", "terminal-emulator": "libtermux.so"}.get(name)
            native = {n for n in names if n.startswith("jni/") and n.endswith(".so")}
            expected_native = {"jni/" + abi + "/" + library for abi in ("armeabi-v7a", "arm64-v8a", "x86", "x86_64")} if library else set()
            require(native == expected_native, "Producer native ABI/library contract changed")
        result[gav] = records
    print(json.dumps(result, sort_keys=True))
  APK_VALIDATOR: |
    import hashlib, json, os, pathlib, re, stat, struct, subprocess, sys, zipfile
    import xml.etree.ElementTree as ET

    def require(ok, message):
        if not ok:
            raise SystemExit(message)

    apk = pathlib.Path(sys.argv[1])
    mode = sys.argv[2]
    require(mode in ("unsigned", "signed"), "Unknown validation mode")
    st = apk.lstat()
    require(stat.S_ISREG(st.st_mode) and st.st_nlink == 1, "APK must be a regular, unlinked file")
    require(100_000 <= st.st_size <= 32 * 1024 * 1024, "APK size outside reviewed bounds")
    data = apk.read_bytes()
    require(data[:4] == b"PK\x03\x04", "Unexpected APK prefix")
    # No ZIP64, multidisk, trailing payload, comment, or hidden APK signing block on unsigned input.
    require(len(data) >= 22 and data[-22:-18] == b"PK\x05\x06", "Noncanonical ZIP ending")
    _, disk, cd_disk, disk_count, count, cd_size, cd_offset, comment = struct.unpack("<4s4H2IH", data[-22:])
    require(disk == cd_disk == comment == 0 and disk_count == count < 20_000,
            "Unsupported ZIP layout")
    require(cd_offset + cd_size == len(data) - 22, "Invalid ZIP central directory")
    if mode == "unsigned":
        require(data[cd_offset - 16:cd_offset] != b"APK Sig Block 42", "Existing APK signing block")
    with zipfile.ZipFile(apk) as z:
        entries = z.infolist()
        require(len(entries) == count, "ZIP entry count mismatch")
        names = [i.filename for i in entries]
        require(len(names) == len(set(names)), "Duplicate ZIP entries")
        require("AndroidManifest.xml" in names and "classes.dex" in names, "Incomplete APK")
        require(sum(i.file_size for i in entries) <= 128 * 1024 * 1024, "Expanded APK too large")
        for i in entries:
            name = i.filename
            parts = name.rstrip("/").split("/")
            require(all(p not in ("", ".", "..") for p in parts) and "\\" not in name
                    and not any(ord(c) < 32 or ord(c) == 127 for c in name), "Unsafe ZIP path")
            require(stat.S_IFMT(i.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR),
                    "Special ZIP entry")
            require(not i.flag_bits & 1 and i.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                    "Unsupported ZIP compression/encryption")
            require(i.file_size <= 64 * 1024 * 1024, "Oversized ZIP entry")
            require(parts[0].lower() != "lib" and not name.lower().endswith(".so"),
                    "Native libraries are not allowed in this companion")
            with z.open(i) as f:
                require(f.read(4) != b"\x7fELF", "Unexpected ELF payload")
            if mode == "unsigned":
                require(not re.match(r"(?i)^META-INF/(?:MANIFEST\.MF|[^/]+\.(?:SF|RSA|DSA|EC))$", name),
                        "Existing JAR signing material")
        require(z.testzip() is None, "ZIP CRC failure")

    tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/37.0.0"
    analyzer = pathlib.Path(os.environ["ANDROID_HOME"]) / "cmdline-tools/16111833/bin/apkanalyzer"
    xml = subprocess.check_output([str(analyzer), "manifest", "print", str(apk)], timeout=60)
    require(len(xml) <= 1024 * 1024, "Manifest too large")
    root = ET.fromstring(xml)
    a = "{http://schemas.android.com/apk/res/android}"
    require(root.tag == "manifest" and root.get("package") == "com.termux.api", "Wrong package")
    require(root.get(a + "versionCode") == "1002" and root.get(a + "versionName") == "0.53.0",
            "Wrong version")
    require(root.get(a + "sharedUserId") == "com.termux"
            and root.get(a + "sharedUserMaxSdkVersion") is None, "Wrong/limited shared UID")
    sdk = root.findall("uses-sdk")
    require(len(sdk) == 1 and sdk[0].get(a + "minSdkVersion") == "24"
            and sdk[0].get(a + "targetSdkVersion") == "28", "Wrong SDK contract")
    apps = root.findall("application")
    require(len(apps) == 1 and apps[0].get(a + "debuggable", "false") == "false",
            "Debuggable or invalid application")
    receivers = [r for r in apps[0].findall("receiver")
                 if r.get(a + "name") in (".TermuxApiReceiver", "com.termux.api.TermuxApiReceiver")]
    require(len(receivers) == 1 and receivers[0].get(a + "exported") == "false", "API receiver exported/missing")
    badging = subprocess.check_output([str(tools / "aapt"), "dump", "badging", str(apk)], timeout=60).decode()
    require("package: name='com.termux.api' versionCode='1002' versionName='0.53.0'" in badging,
            "Badging disagrees with manifest")
    require(not re.search(r"^native-code:|^application-debuggable", badging, re.M), "Native/debug APK")
    subprocess.run([str(tools / "zipalign"), "-c", "-P", "16", "4", str(apk)], check=True, timeout=60,
                   stdout=subprocess.DEVNULL)
    verify = subprocess.run([str(tools / "apksigner"), "verify", "--verbose", "--print-certs",
                             "--min-sdk-version", "23", str(apk)], capture_output=True, text=True, timeout=60)
    if mode == "unsigned":
        require(verify.returncode != 0, "APK already verifies as signed")
    else:
        require(verify.returncode == 0, "Signed APK failed verification")
        lines = verify.stdout.splitlines()
        for line in ("Verified using v1 scheme (JAR signing): true",
                     "Verified using v2 scheme (APK Signature Scheme v2): true",
                     "Verified using v3 scheme (APK Signature Scheme v3): true",
                     "Verified using v4 scheme (APK Signature Scheme v4): false", "Number of signers: 1"):
            require(line in lines, "Missing signature requirement: " + line)
        certificates = re.findall(r"certificate SHA-256 digest: ([0-9a-fA-F]+)", verify.stdout)
        require(bool(certificates) and set(c.lower() for c in certificates) ==
                {"221f36cca6e32ee1666bb210046654b26900cd9ea98c2155d0cbe66102060437"}, "Wrong Fold certificate")
    print(json.dumps({"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}))

jobs:
  build:
    name: Two independent pinned source chains
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TZ: UTC
      LANG: C.UTF-8
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          {
            printf 'FOLD_CI_WORK=%s\n' "$work"
            printf 'ANDROID_SDK_ROOT=%s/android-sdk\n' "$work"
            printf 'ANDROID_HOME=%s/android-sdk\n' "$work"
            printf 'ANDROID_USER_HOME=%s/android-user-home\n' "$work"
          } >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg ca-certificates git curl unzip python3 make file libstdc++6
      - name: Check out the pinned API release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termux/termux-api
          ref: ${{ env.API_SOURCE_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Check out the exact shared-library source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termux/termux-app
          ref: ${{ fromJSON(env.CANDIDATE_CONTRACT).source_dependencies.shared.commit }}
          path: shared-upstream
          persist-credentials: false

      - name: Check out the exact transitive AM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termux/termux-am-library
          ref: ${{ fromJSON(env.CANDIDATE_CONTRACT).source_dependencies.am.commit }}
          path: am-upstream
          persist-credentials: false

      - name: Validate all source/wrapper identities and prepare pristine rounds
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          c = json.loads(os.environ["CANDIDATE_CONTRACT"])
          sources = {"api": ("upstream", c["source_commit"], c["source_tree"], c["source_date_epoch"],
                             c["upstream_wrapper_sha256"], c["upstream_wrapper_properties_sha256"])}
          for role, source in c["source_dependencies"].items():
              sources[role] = (role + "-upstream", source["commit"], source["tree"], source["epoch"],
                               c["legacy_recipe"]["wrapper_sha256"], c["legacy_recipe"]["wrapper_properties_sha256"])
          for role, (directory, commit, tree, epoch, wrapper_hash, properties_hash) in sources.items():
              root = pathlib.Path(directory)
              git = lambda *args: subprocess.check_output(["git", "-C", directory, *args], text=True).strip()
              if (git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}"), git("log", "-1", "--format=%ct"), git("status", "--porcelain")) != (commit, tree, str(epoch), ""):
                  raise SystemExit("Source identity mismatch: " + role)
              for file, expected in (("gradle-wrapper.jar", wrapper_hash),
                                     ("gradle-wrapper.properties", properties_hash)):
                  if hashlib.sha256((root / "gradle/wrapper" / file).read_bytes()).hexdigest() != expected:
                      raise SystemExit("Wrapper provenance mismatch: " + role)
              for n in (1, 2):
                  round_dir = pathlib.Path(os.environ["FOLD_CI_WORK"]) / ("round-" + str(n))
                  target = round_dir / role
                  target.mkdir(parents=True)
                  archive = round_dir / (role + "-source.tar")
                  subprocess.run(["git", "-C", directory, "-c", "tar.umask=0022", "archive", "--format=tar", "--output=" + str(archive), commit], check=True)
                  subprocess.run(["tar", "--same-permissions", "-xf", str(archive), "-C", str(target)], check=True)
          PY
          # Neither old unchecked wrapper runs. Verify each declared distribution independently.
          while read -r version checksum; do
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
              "https://services.gradle.org/distributions/gradle-$version-all.zip" -o "$FOLD_CI_WORK/gradle-$version-all.zip"
            echo "$checksum  $FOLD_CI_WORK/gradle-$version-all.zip" | sha256sum -c -
            unzip -q "$FOLD_CI_WORK/gradle-$version-all.zip" -d "$FOLD_CI_WORK/gradle-dist"
          done <<'DISTRIBUTIONS'
          7.2 a8da5b02437a60819cad23e10fc7e9cf32bcb57029d9cb277e26eeff76ce014b
          8.9 258e722ec21e955201e31447b0aed14201765a3bfbae296a46cf60b70e66db70
          DISTRIBUTIONS
          printf '%s' "$PUBLISH_INIT" > "$FOLD_CI_WORK/publish.init.gradle"
          printf '%s' "$LOCAL_REPOSITORY_INIT" > "$FOLD_CI_WORK/local.init.gradle"
          for n in 1 2; do
            printf '%s' "$LIBRARY_SETTINGS" > "$FOLD_CI_WORK/round-$n/shared/companion.settings.gradle"
            mkdir "$FOLD_CI_WORK/round-$n/maven"
          done

      - name: Set up Java 21 for SDK installation and API consumption
        id: java21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true

      - name: Install the retained producer and consumer SDK recipes
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0; SDK installation itself needs the modern JVM
          # CLT 23 removed the legacy --licenses handshake; package installs still handle licenses.
          accept-android-sdk-licenses: false
          packages: 'platforms;android-30 build-tools;30.0.2 ndk;21.1.6352462 platforms;android-35 build-tools;34.0.0 build-tools;37.0.0'

      - name: Set up Java 11 for the unchanged legacy producer recipes
        id: java11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          check-latest: true

      - name: Independently build and publish both complete source dependency chains
        shell: bash
        env:
          JITPACK_NDK_VERSION: '21.1.6352462'
        run: |
          set -euo pipefail
          grep -E '^JAVA_VERSION="11[.]' "$JAVA_HOME/release"
          "$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1 | grep -E '^[[:space:]]*os[.]arch = amd64$'
          gradle="$FOLD_CI_WORK/gradle-dist/gradle-7.2/bin/gradle"
          common=(--no-daemon --no-build-cache --no-configuration-cache --max-workers=2)
          for n in 1 2; do
            round="$FOLD_CI_WORK/round-$n"
            export COMPANION_MAVEN_REPO="$round/maven"
            export GRADLE_USER_HOME="$round/gradle-am" SOURCE_GROUP=com.termux SOURCE_VERSION=v2.0.0 SOURCE_DATE_EPOCH=1650918843
            "$gradle" "${common[@]}" -p "$round/am" -I "$FOLD_CI_WORK/publish.init.gradle" \
              :termux-am-library:publishReleasePublicationToCompanionRepository
            export GRADLE_USER_HOME="$round/gradle-shared" SOURCE_GROUP=com.termux.termux-app SOURCE_VERSION=7bceab88e2 SOURCE_DATE_EPOCH=1750867852
            export COMPANION_CONSUMER=shared
            shared=(-p "$round/shared" --settings-file "$round/shared/companion.settings.gradle"
              -I "$FOLD_CI_WORK/publish.init.gradle" -I "$FOLD_CI_WORK/local.init.gradle")
            "$gradle" "${common[@]}" "${shared[@]}" companionSourceResolution
            "$gradle" "${common[@]}" "${shared[@]}" \
              :terminal-emulator:publishReleasePublicationToCompanionRepository \
              :terminal-view:publishReleasePublicationToCompanionRepository \
              :termux-shared:publishReleasePublicationToCompanionRepository
            python3 -I -c "$PUBLICATION_INSPECTOR" "$round/maven" > "$round/publications.json"
          done

      - name: Build API twice using only each round's source publications
        shell: bash
        env:
          JAVA_HOME: ${{ steps.java21.outputs.path }}
          JAVA11_HOME: ${{ steps.java11.outputs.path }}
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME/bin:$PATH"
          grep -E '^JAVA_VERSION="21[.]' "$JAVA_HOME/release"
          "$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1 | grep -E '^[[:space:]]*os[.]arch = amd64$'
          unset TERMUX_API_APP__BUILD__APP_VERSION_NAME TERMUX_API_APP__BUILD__APK_VERSION_TAG
          export COMPANION_CONSUMER=api
          candidate="$FOLD_CI_WORK/api-companion-candidate"
          mkdir "$candidate"
          for n in 1 2; do
            round="$FOLD_CI_WORK/round-$n"
            export GRADLE_USER_HOME="$round/gradle-api" COMPANION_MAVEN_REPO="$round/maven"
            args=(--no-daemon --no-build-cache --no-configuration-cache --max-workers=2
              -p "$round/api" -I "$FOLD_CI_WORK/local.init.gradle")
            gradle="$FOLD_CI_WORK/gradle-dist/gradle-8.9/bin/gradle"
            "$gradle" "${args[@]}" companionSourceResolution
            if [ "$n" = 1 ]; then "$gradle" "${args[@]}" :app:testReleaseUnitTest; fi
            "$gradle" "${args[@]}" :app:assembleRelease
            mapfile -t apks < <(find "$round/api/app/build/outputs/apk/release" -type f -name '*.apk')
            test "${#apks[@]}" -eq 1
            test "$(basename "${apks[0]}")" = 'termux-api-app_v0.53.0+release.apk'
            python3 -I -c "$APK_VALIDATOR" "${apks[0]}" unsigned
            if [ "$n" = 1 ]; then cp "${apks[0]}" "$candidate/termux-api-unsigned.apk"; else cmp "$candidate/termux-api-unsigned.apk" "${apks[0]}"; fi
          done
          python3 -I - "$candidate" <<'PY'
          import hashlib, json, os, pathlib, stat, sys, tarfile
          def digest(stream):
              return hashlib.file_digest(stream, "sha256").hexdigest()
          def record(path):
              with path.open("rb") as stream:
                  return {"sha256": digest(stream), "size": path.stat().st_size}
          temp = pathlib.Path(os.environ["FOLD_CI_WORK"])
          manifest = json.loads(os.environ["CANDIDATE_CONTRACT"])
          tools = {p: record(pathlib.Path(os.environ["ANDROID_HOME"]) / p) for p in json.loads(os.environ["SDK_TOOL_FILES"])}
          java_versions = {}
          for major, home in ((11, os.environ["JAVA11_HOME"]), (21, os.environ["JAVA_HOME"])):
              release = dict(line.split("=", 1) for line in (pathlib.Path(home) / "release").read_text().splitlines() if "=" in line)
              java_versions[str(major)] = release["JAVA_VERSION"].strip('"')
              for file in ("release", "lib/modules"):
                  tools["jdk" + str(major) + "/" + file] = record(pathlib.Path(home) / file)
          rounds = []
          for n in (1, 2):
              root = temp / ("round-" + str(n))
              archives, agp = {}, {}
              for role, version in (("api", "8.7.3"), ("shared", "4.2.2"), ("am", "7.0.3")):
                  archive = root / (role + "-source.tar")
                  # Check every archived production/build file after execution; ignore directory mtimes/build outputs.
                  with tarfile.open(archive) as source:
                      for member in source:
                          path = root / role / member.name
                          if member.isfile():
                              if path.is_symlink() or not path.is_file() or stat.S_IMODE(path.stat().st_mode) != member.mode:
                                  raise SystemExit("Changed source file type/mode: " + member.name)
                              with path.open("rb") as actual, source.extractfile(member) as original:
                                  if digest(actual) != digest(original):
                                      raise SystemExit("Changed tracked source/build file: " + member.name)
                          elif member.issym() and (not path.is_symlink() or os.readlink(path) != member.linkname):
                              raise SystemExit("Changed source symlink")
                  archives[role] = record(archive)
                  jars = list((root / ("gradle-" + role)).glob("caches/modules-2/files-2.1/com.android.tools.build/gradle/" + version + "/*/gradle-" + version + ".jar"))
                  if len(jars) != 1:
                      raise SystemExit("Missing/ambiguous AGP binary")
                  agp[role] = record(jars[0])
              rounds.append({"round": n, "archives": archives, "agp": agp,
                             "publications": json.loads((root / "publications.json").read_text())})
          overlays = {key: {"sha256": hashlib.sha256(os.environ[key].encode()).hexdigest(), "size": len(os.environ[key].encode())}
                      for key in ("LIBRARY_SETTINGS", "PUBLISH_INIT", "LOCAL_REPOSITORY_INIT")}
          for key, paths in {"LIBRARY_SETTINGS": [temp / ("round-" + str(n)) / "shared/companion.settings.gradle" for n in (1, 2)],
                             "PUBLISH_INIT": [temp / "publish.init.gradle"], "LOCAL_REPOSITORY_INIT": [temp / "local.init.gradle"]}.items():
              if any(record(path) != overlays[key] for path in paths):
                  raise SystemExit("Build-resolution overlay changed")
          candidate = pathlib.Path(sys.argv[1])
          apk = candidate / "termux-api-unsigned.apk"
          manifest.update(workflow_repository="fitchmultz/termux-app", workflow_commit=os.environ["WORKFLOW_COMMIT"],
                          workflow_run_id=os.environ["WORKFLOW_RUN_ID"], workflow_run_attempt=os.environ["WORKFLOW_RUN_ATTEMPT"],
                          unsigned_apk_sha256=record(apk)["sha256"], unsigned_apk_size=apk.stat().st_size,
                          build_inputs={"overlays": overlays, "tools": tools, "java_versions": java_versions, "rounds": rounds})
          encoded = json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          if len(encoded.encode()) > 16_384:
              raise SystemExit("Public provenance exceeds signing-input bound")
          (candidate / "manifest.json").write_text(encoded)
          PY
          printf 'Two full source chains produced byte-identical unsigned APKs; intermediate inputs are recorded, not assumed identical.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only bounded unsigned signing inputs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-companion-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FOLD_CI_WORK }}/api-companion-candidate/termux-api-unsigned.apk
            ${{ env.FOLD_CI_WORK }}/api-companion-candidate/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Opt-in isolated Fold signing (artifact only)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.sign_companion == true &&
      github.ref == 'refs/heads/fold/main' && github.repository == 'fitchmultz/termux-app'
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 20
    environment: termux-fold-signing
    permissions:
      actions: read
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          {
            printf 'FOLD_CI_WORK=%s\n' "$work"
            printf 'ANDROID_SDK_ROOT=%s/android-sdk\n' "$work"
            printf 'ANDROID_HOME=%s/android-sdk\n' "$work"
            printf 'ANDROID_USER_HOME=%s/android-user-home\n' "$work"
          } >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg ca-certificates curl unzip libstdc++6 python3
          gh_archive="$work/gh.tar.gz"
          curl --disable --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz \
            --output "$gh_archive"
          test "$(stat -c %s "$gh_archive")" = 15031001
          printf '62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8  %s\n' "$gh_archive" | sha256sum -c -
          tar -xzf "$gh_archive" -C "$work"
          printf '%s/gh_2.103.2_linux_amd64/bin\n' "$work" >> "$GITHUB_PATH"
      # No repository checkout, cache restore, Gradle, or upstream/build-artifact code execution here.
      - name: Check same-run artifact identity and download-size bound
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/fitchmultz/termux-app/actions/artifacts/$ARTIFACT_ID" > "$FOLD_CI_WORK/artifact-envelope.json"
          python3 -I - "$FOLD_CI_WORK/artifact-envelope.json" <<'PY'
          import json, os, sys
          a = json.load(open(sys.argv[1]))
          run = a["workflow_run"]
          if not (str(a["id"]) == os.environ["ARTIFACT_ID"] and not a["expired"]
                  and a["name"] == "api-companion-candidate-" + os.environ["WORKFLOW_RUN_ID"] + "-" + os.environ["WORKFLOW_RUN_ATTEMPT"]
                  and 0 < a["size_in_bytes"] <= 33 * 1024 * 1024
                  and str(run["id"]) == os.environ["WORKFLOW_RUN_ID"]
                  and run["head_sha"] == os.environ["WORKFLOW_COMMIT"] and run["head_branch"] == "fold/main"):
              raise SystemExit("Untrusted/oversized artifact envelope")
          PY

      - name: Download only this build job's artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ env.FOLD_CI_WORK }}/candidate
          merge-multiple: true

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true

      - name: Install trusted APK parsers and signing tools (not from artifact)
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          # CLT 23 removed the legacy --licenses handshake; package installs still handle licenses.
          accept-android-sdk-licenses: false
          packages: 'build-tools;37.0.0'

      - name: Independently validate the complete candidate before loading secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$FOLD_CI_WORK/candidate" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys
          candidate = pathlib.Path(sys.argv[1])
          if {p.name for p in candidate.iterdir()} != {"termux-api-unsigned.apk", "manifest.json"}:
              raise SystemExit("Unexpected signing input files")
          for name, limit in (("manifest.json", 16_384), ("termux-api-unsigned.apk", 32 * 1024 * 1024)):
              st = (candidate / name).lstat()
              if not (stat.S_ISREG(st.st_mode) and st.st_nlink == 1 and 0 < st.st_size <= limit):
                  raise SystemExit("Invalid input type/size")
          def unique(pairs):
              result = {}
              for k, v in pairs:
                  if k in result:
                      raise SystemExit("Duplicate manifest key")
                  result[k] = v
              return result
          manifest = json.loads((candidate / "manifest.json").read_text(), object_pairs_hook=unique)
          apk = candidate / "termux-api-unsigned.apk"
          expected = json.loads(os.environ["CANDIDATE_CONTRACT"])
          expected.update(workflow_repository="fitchmultz/termux-app",
                          workflow_commit=os.environ["WORKFLOW_COMMIT"],
                          workflow_run_id=os.environ["WORKFLOW_RUN_ID"],
                          workflow_run_attempt=os.environ["WORKFLOW_RUN_ATTEMPT"],
                          unsigned_apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),
                          unsigned_apk_size=apk.stat().st_size)
          # Source inputs are public build claims, not executable signing inputs or independently rebuilt here.
          inputs = manifest.get("build_inputs")
          if not isinstance(inputs, dict) or set(inputs) != {"overlays", "tools", "java_versions", "rounds"}:
              raise SystemExit("Invalid build-input schema")
          def records(value, limits):
              if not isinstance(value, dict) or set(value) != set(limits):
                  raise SystemExit("Unexpected build-input records")
              for name, limit in limits.items():
                  r = value[name]
                  if not (isinstance(r, dict) and set(r) == {"sha256", "size"}
                          and isinstance(r["sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", r["sha256"])
                          and type(r["size"]) is int and 0 < r["size"] <= limit):
                      raise SystemExit("Invalid digest/size record")
          overlays = {key: {"sha256": hashlib.sha256(os.environ[key].encode()).hexdigest(), "size": len(os.environ[key].encode())}
                      for key in ("LIBRARY_SETTINGS", "PUBLISH_INIT", "LOCAL_REPOSITORY_INIT")}
          if inputs["overlays"] != overlays:
              raise SystemExit("Unreviewed build-resolution overlays")
          tool_names = json.loads(os.environ["SDK_TOOL_FILES"]) + ["jdk" + major + "/" + file for major in ("11", "21") for file in ("release", "lib/modules")]
          records(inputs["tools"], {key: 512 * 1024 * 1024 for key in tool_names})
          versions = inputs["java_versions"]
          if not isinstance(versions, dict) or set(versions) != {"11", "21"} or any(
                  not isinstance(versions[k], str) or not re.fullmatch(k + r"\.[0-9A-Za-z._+-]{1,60}", versions[k]) for k in versions):
              raise SystemExit("Invalid recorded JVM versions")
          rounds = inputs["rounds"]
          if not isinstance(rounds, list) or len(rounds) != 2:
              raise SystemExit("Missing independent source rounds")
          publications = json.loads(os.environ["PUBLICATION_CONTRACT"])
          for n, r in enumerate(rounds, 1):
              if not isinstance(r, dict) or set(r) != {"round", "archives", "agp", "publications"} or type(r["round"]) is not int or r["round"] != n:
                  raise SystemExit("Invalid source round")
              records(r["archives"], {role: 128 * 1024 * 1024 for role in ("api", "shared", "am")})
              records(r["agp"], {role: 32 * 1024 * 1024 for role in ("api", "shared", "am")})
              if not isinstance(r["publications"], dict) or set(r["publications"]) != set(publications):
                  raise SystemExit("Unexpected source publications")
              for publication in r["publications"].values():
                  records(publication, {"aar": 32 * 1024 * 1024, "pom": 65_536, "module": 65_536})
          # Independently match the verification-tool files installed for this signing job.
          for file in tool_names:
              if file.startswith(("build-tools/37.0.0/", "cmdline-tools/")):
                  path = pathlib.Path(os.environ["ANDROID_HOME"]) / file
                  if inputs["tools"][file] != {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(), "size": path.stat().st_size}:
                      raise SystemExit("Verification tool provenance mismatch")
          expected["build_inputs"] = inputs
          # Canonical JSON comparison also distinguishes booleans from numbers; no extra keys/claims.
          if json.dumps(manifest, sort_keys=True) != json.dumps(expected, sort_keys=True):
              raise SystemExit("Candidate manifest/hash/provenance mismatch")
          PY
          python3 -I -c "$APK_VALIDATOR" "$FOLD_CI_WORK/candidate/termux-api-unsigned.apk" unsigned

      - name: Sign only the validated companion with the existing protected key
        shell: bash
        env:
          FOLD_KEYSTORE_BASE64: ${{ secrets.TERMUX_FOLD_KEYSTORE_BASE64 }}
          FOLD_KEYSTORE_PASSWORD: ${{ secrets.TERMUX_FOLD_KEYSTORE_PASSWORD }}
          EXPECTED_KEYSTORE_SHA256: ${{ secrets.TERMUX_FOLD_KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          keys="$FOLD_CI_WORK/api-companion-keys"
          mkdir -m 700 "$keys"
          cleanup() { rm -f "$keys/key.p12" "$keys/store.pass" "$keys/key.pass" "$keys/key.der"; rmdir "$keys"; }
          trap cleanup EXIT
          trap 'exit 1' HUP INT TERM
          printf '%s' "$FOLD_KEYSTORE_BASE64" | base64 --decode > "$keys/key.p12"
          printf '%s\n' "$FOLD_KEYSTORE_PASSWORD" > "$keys/store.pass"
          printf '%s\n' "$FOLD_KEYSTORE_PASSWORD" > "$keys/key.pass"
          [[ "$EXPECTED_KEYSTORE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$keys/key.p12" | cut -d' ' -f1)" = "$EXPECTED_KEYSTORE_SHA256"
          unset FOLD_KEYSTORE_BASE64 FOLD_KEYSTORE_PASSWORD EXPECTED_KEYSTORE_SHA256
          keytool -exportcert -keystore "$keys/key.p12" -storetype PKCS12 \
            -storepass:file "$keys/store.pass" -alias termux-fold-release -file "$keys/key.der" >/dev/null 2>&1
          echo "221f36cca6e32ee1666bb210046654b26900cd9ea98c2155d0cbe66102060437  $keys/key.der" | sha256sum -c -
          mkdir "$FOLD_CI_WORK/api-companion-signed"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$keys/key.p12" --ks-type PKCS12 --ks-key-alias termux-fold-release \
            --ks-pass "file:$keys/store.pass" --key-pass "file:$keys/key.pass" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$FOLD_CI_WORK/api-companion-signed/Termux-API-0.53.0-Fold.apk" \
            "$FOLD_CI_WORK/candidate/termux-api-unsigned.apk"

      - name: Independently verify signed metadata, schemes, certificate, and archive
        shell: bash
        run: |
          set -euo pipefail
          signed="$FOLD_CI_WORK/api-companion-signed/Termux-API-0.53.0-Fold.apk"
          python3 -I -c "$APK_VALIDATOR" "$signed" signed
          test ! -e "$signed.idsig"
          python3 -I - "$FOLD_CI_WORK" <<'PY'
          import hashlib, json, os, pathlib, sys
          temp = pathlib.Path(sys.argv[1])
          out = temp / "api-companion-signed"
          apk = out / "Termux-API-0.53.0-Fold.apk"
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / "SHA256SUMS").write_text(digest + "  " + apk.name + "\n")
          provenance = json.loads((temp / "candidate/manifest.json").read_text())
          provenance.update(signed_filename=apk.name, signed_apk_sha256=digest, signed_apk_size=apk.stat().st_size,
                            certificate_sha256="22:1F:36:CC:A6:E3:2E:E1:66:6B:B2:10:04:66:54:B2:69:00:CD:9E:A9:8C:21:55:D0:CB:E6:61:02:06:04:37",
                            v1=True, v2=True, v3=True, v4=False,
                            workflow_run="https://github.com/fitchmultz/termux-app/actions/runs/" + os.environ["WORKFLOW_RUN_ID"])
          (out / "PROVENANCE.json").write_text(json.dumps(provenance, sort_keys=True, indent=2) + "\n")
          if {p.name for p in out.iterdir()} != {apk.name, "SHA256SUMS", "PROVENANCE.json"}:
              raise SystemExit("Unexpected signed output")
          PY
          printf 'Fold-signed companion verified. Artifact only: not published, installed, or physically tested.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Always remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FOLD_CI_WORK:-}" ]; then exit 0; fi
          keys="$FOLD_CI_WORK/api-companion-keys"
          rm -f "$keys/key.p12" "$keys/store.pass" "$keys/key.pass" "$keys/key.der"
          if [ -d "$keys" ]; then rmdir "$keys"; fi

      - name: Save only the verified signed APK, checksum, and public provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termux-api-0.53.0-fold-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FOLD_CI_WORK }}/api-companion-signed/Termux-API-0.53.0-Fold.apk
            ${{ env.FOLD_CI_WORK }}/api-companion-signed/SHA256SUMS
            ${{ env.FOLD_CI_WORK }}/api-companion-signed/PROVENANCE.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
