name: Bootstrap validation

on:
  push:
    branches: ['fold/**']
    paths:
      - 'tools/bootstrap/**'
      - '.github/workflows/bootstrap_validation.yml'
  pull_request:
    branches: ['fold/main']
    paths:
      - 'tools/bootstrap/**'
      - '.github/workflows/bootstrap_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SHELL: /bin/bash

concurrency:
  group: bootstrap-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-validation:
    name: Offline bootstrap validation
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 15
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          printf 'FOLD_CI_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git curl unzip binutils dpkg gpgv gzip xz-utils zip jq python3 make file libstdc++6
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test runner failure paths and build twice without target execution
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/bootstrap -p 'test_*.py' -v
          python3 tools/bootstrap/bootstrap.py build --cache "$FOLD_CI_WORK/bootstrap-cache" --output "$FOLD_CI_WORK/first/bootstrap-aarch64.zip" > "$FOLD_CI_WORK/bootstrap-first.log" 2>&1
          python3 tools/bootstrap/bootstrap.py build --offline --cache "$FOLD_CI_WORK/bootstrap-cache" --output "$FOLD_CI_WORK/second/bootstrap-aarch64.zip" > "$FOLD_CI_WORK/bootstrap-second.log" 2>&1
          cmp "$FOLD_CI_WORK/first/bootstrap-aarch64.zip" "$FOLD_CI_WORK/second/bootstrap-aarch64.zip"
          sha256sum "$FOLD_CI_WORK/first/bootstrap-aarch64.zip"
          python3 tools/bootstrap/check_payload.py "$FOLD_CI_WORK/first/bootstrap-aarch64.zip"
      - name: Save bootstrap validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-validation-logs
          path: ${{ env.FOLD_CI_WORK }}/bootstrap-*.log
          retention-days: 3
