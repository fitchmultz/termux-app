name: Fold checks

on:
  push:
    branches:
      - 'fold/**'
  pull_request:
    branches:
      - 'fold/main'

permissions:
  contents: read

concurrency:
  group: fold-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

  unit-tests:
    name: Gradle unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute tests
        run: ./gradlew --no-daemon test

  integration-apk-build:
    name: Integration APK compile check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMUX_APP_VERSION_NAME: 0.119.0-fold.ci
      TERMUX_APK_VERSION_TAG: fold-integration-ci
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
      TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '0'
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile debug APK without publishing artifacts
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Compile and verify reproducible unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./gradlew --no-daemon :app:assembleRelease
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          apksigner="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)/apksigner"
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Release APK unexpectedly contains a signing certificate' >&2
            exit 1
          fi
          first_hash="$(sha256sum "$apk" | cut -d' ' -f1)"

          # Run clean separately: the upstream clean task removes downloaded bootstrap archives.
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :app:assembleRelease
          mapfile -t rebuilt_apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#rebuilt_apks[@]}" -eq 1
          second_hash="$(sha256sum "${rebuilt_apks[0]}" | cut -d' ' -f1)"
          test "$first_hash" = "$second_hash"
          printf 'reproducible unsigned release sha256=%s\n' "$first_hash"
