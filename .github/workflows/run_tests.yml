name: Fold checks

on:
  push:
    branches:
      - 'fold/**'
  pull_request:
    branches:
      - 'fold/main'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SHELL: /bin/bash

concurrency:
  group: fold-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 10
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  bootstrap-validation:
    name: Offline bootstrap validation
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 15
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          printf 'FOLD_CI_WORK=%s\n' "$work" >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git curl unzip binutils dpkg gpgv gzip xz-utils zip jq python3 make file libstdc++6
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test runner failure paths and build twice without target execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/bootstrap -p 'test_*.py' -v
          python3 tools/bootstrap/bootstrap.py build --cache "$FOLD_CI_WORK/bootstrap-cache" --output "$FOLD_CI_WORK/first/bootstrap-aarch64.zip" > "$FOLD_CI_WORK/bootstrap-first.log" 2>&1
          python3 tools/bootstrap/bootstrap.py build --offline --cache "$FOLD_CI_WORK/bootstrap-cache" --output "$FOLD_CI_WORK/second/bootstrap-aarch64.zip" > "$FOLD_CI_WORK/bootstrap-second.log" 2>&1
          cmp "$FOLD_CI_WORK/first/bootstrap-aarch64.zip" "$FOLD_CI_WORK/second/bootstrap-aarch64.zip"
          sha256sum "$FOLD_CI_WORK/first/bootstrap-aarch64.zip"
          python3 tools/bootstrap/check_payload.py "$FOLD_CI_WORK/first/bootstrap-aarch64.zip"
      - name: Save bootstrap validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-validation-logs
          path: ${{ env.FOLD_CI_WORK }}/bootstrap-*.log
          retention-days: 3

  unit-tests:
    name: Gradle unit tests
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 30
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          {
            printf 'FOLD_CI_WORK=%s\n' "$work"
            printf 'ANDROID_SDK_ROOT=%s/android-sdk\n' "$work"
            printf 'ANDROID_HOME=%s/android-sdk\n' "$work"
            printf 'ANDROID_USER_HOME=%s/android-user-home\n' "$work"
            printf 'GRADLE_USER_HOME=%s/gradle-home\n' "$work"
          } >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg ca-certificates git curl unzip binutils dpkg gpgv gzip xz-utils zip jq python3 make file libstdc++6
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true
      - name: Install pinned Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          accept-android-sdk-licenses: false # CLT 23 removed the legacy --licenses handshake.
          packages: 'platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370'
      - name: Execute tests
        run: ./gradlew --no-daemon test
      - name: Save synthetic workbench renders and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fold-test-reports
          path: |
            app/build/reports/tests/workbench/*.png
            **/build/test-results/**/*.xml
          retention-days: 3

  integration-apk-build:
    name: Integration APK compile check
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 45
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          {
            printf 'FOLD_CI_WORK=%s\n' "$work"
            printf 'ANDROID_SDK_ROOT=%s/android-sdk\n' "$work"
            printf 'ANDROID_HOME=%s/android-sdk\n' "$work"
            printf 'ANDROID_USER_HOME=%s/android-user-home\n' "$work"
            printf 'GRADLE_USER_HOME=%s/gradle-home\n' "$work"
          } >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg ca-certificates git curl unzip binutils dpkg gpgv gzip xz-utils zip jq python3 make file libstdc++6
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true
      - name: Install pinned Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          accept-android-sdk-licenses: false # CLT 23 removed the legacy --licenses handshake.
          packages: 'platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370'
      - name: Validate opinionated release metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(./gradlew --no-daemon -q :app:foldReleaseMetadata)"
          version_name="$(awk -F= '$1 == "versionName" {print $2}' <<<"$metadata")"
          version_code="$(awk -F= '$1 == "versionCode" {print $2}' <<<"$metadata")"
          [[ "$version_name" =~ ^0[.]119[.]0-fold[.][1-9][0-9]*$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          grep -Fx 'applicationLabel=Termux Fold' <<<"$metadata"
          grep -Fx 'packageVariant=apt-android-7' <<<"$metadata"
          grep -Fx 'supportedAbis=arm64-v8a' <<<"$metadata"
          grep -Fq "version \`$version_name\` with monotonic version code \`$version_code\`" FOLD_PROFILE.md
      - name: Verify no-clean native bootstrap replacement
        run: python3 tools/bootstrap/check_native_incremental.py "$ANDROID_HOME/ndk/30.0.16248370"
      - name: Compile debug APK without publishing artifacts
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Compile and verify reproducible unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          metadata="$(./gradlew --no-daemon -q :app:foldReleaseMetadata)"
          version_name="$(awk -F= '$1 == "versionName" {print $2}' <<<"$metadata")"
          version_code="$(awk -F= '$1 == "versionCode" {print $2}' <<<"$metadata")"
          application_label="$(awk -F= '$1 == "applicationLabel" {print substr($0, index($0, "=") + 1)}' <<<"$metadata")"
          ./gradlew --no-daemon :app:assembleRelease
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -F "package: name='com.termux' versionCode='$version_code' versionName='$version_name'" <<<"$badging"
          grep -Fx "application-label:'$application_label'" <<<"$badging"
          grep -Fx "sdkVersion:'24'" <<<"$badging"
          grep -Fx "targetSdkVersion:'28'" <<<"$badging"
          mapfile -t packaged_abis < <(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)
          test "${#packaged_abis[@]}" -eq 1
          test "${packaged_abis[0]}" = 'arm64-v8a'
          apksigner="$build_tools/apksigner"
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Release APK unexpectedly contains a signing certificate' >&2
            exit 1
          fi
          first_hash="$(sha256sum "$apk" | cut -d' ' -f1)"

          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :app:assembleRelease
          mapfile -t rebuilt_apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#rebuilt_apks[@]}" -eq 1
          second_hash="$(sha256sum "${rebuilt_apks[0]}" | cut -d' ' -f1)"
          test "$first_hash" = "$second_hash"
          printf 'reproducible unsigned release sha256=%s\n' "$first_hash"
