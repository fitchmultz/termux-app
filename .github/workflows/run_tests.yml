name: Fold checks

on:
  push:
    branches:
      - 'fold/**'
  pull_request:
    branches:
      - 'fold/main'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SHELL: /bin/bash

concurrency:
  group: fold-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Gradle wrapper validation
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 10
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  android:
    name: Android tests and APK
    runs-on: [self-hosted, Linux, ARM64]
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      options: --platform linux/amd64
      volumes:
        - /lib/ld-linux-aarch64.so.1:/lib/ld-linux-aarch64.so.1:ro
        - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:ro
    timeout-minutes: 75
    steps:
      - name: Prepare M1 job container
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = x86_64
          work="$(mktemp -d "$RUNNER_TEMP/fold-ci.XXXXXXXX")"
          {
            printf 'FOLD_CI_WORK=%s\n' "$work"
            printf 'ANDROID_SDK_ROOT=%s/android-sdk\n' "$work"
            printf 'ANDROID_HOME=%s/android-sdk\n' "$work"
            printf 'ANDROID_USER_HOME=%s/android-user-home\n' "$work"
            printf 'GRADLE_USER_HOME=%s/gradle-home\n' "$work"
          } >> "$GITHUB_ENV"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnupg ca-certificates git curl unzip binutils dpkg gpgv gzip xz-utils zip jq python3 make file libstdc++6
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          check-latest: true
      - name: Install pinned Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
          accept-android-sdk-licenses: false # CLT 23 removed the legacy --licenses handshake.
          packages: 'platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370'
      - name: Prepare optional verified Robolectric test seed
        run: bash tools/ci/restore-robolectric-seed.sh
      - name: Validate opinionated release metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(./gradlew --no-daemon -q :app:foldReleaseMetadata)"
          version_name="$(awk -F= '$1 == "versionName" {print $2}' <<<"$metadata")"
          version_code="$(awk -F= '$1 == "versionCode" {print $2}' <<<"$metadata")"
          [[ "$version_name" =~ ^0[.]119[.]0-fold[.][1-9][0-9]*$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          grep -Fx 'applicationLabel=Termux Fold' <<<"$metadata"
          grep -Fx 'packageVariant=apt-android-7' <<<"$metadata"
          grep -Fx 'supportedAbis=arm64-v8a' <<<"$metadata"
          grep -Fq "version \`$version_name\` with monotonic version code \`$version_code\`" FOLD_PROFILE.md
          printf 'FOLD_VERSION_NAME=%s\nFOLD_VERSION_CODE=%s\n' "$version_name" "$version_code" >> "$GITHUB_ENV"
      - name: Verify no-clean native bootstrap replacement
        run: python3 tools/bootstrap/check_native_incremental.py "$ANDROID_HOME/ndk/30.0.16248370"
      - name: Run tests and compile unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          ./gradlew --no-daemon --init-script tools/ci/robolectric-seed.init.gradle test :app:assembleRelease
      - name: Verify unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -F "package: name='com.termux' versionCode='$FOLD_VERSION_CODE' versionName='$FOLD_VERSION_NAME'" <<<"$badging"
          grep -Fx "application-label:'Termux Fold'" <<<"$badging"
          grep -Fx "sdkVersion:'24'" <<<"$badging"
          grep -Fx "targetSdkVersion:'28'" <<<"$badging"
          mapfile -t packaged_abis < <(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)
          test "${#packaged_abis[@]}" -eq 1
          test "${packaged_abis[0]}" = 'arm64-v8a'
          apksigner="$build_tools/apksigner"
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Release APK unexpectedly contains a signing certificate' >&2
            exit 1
          fi
          sha256sum "$apk"
      - name: Save verified main APK for release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fold/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fold-main-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
      - name: Save synthetic workbench renders and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fold-test-reports
          path: |
            app/build/reports/tests/workbench/*.png
            **/build/test-results/**/*.xml
          retention-days: 3
