plugins {
    id 'com.android.library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    namespace = "com.termux.shared"
    compileSdk {
        version = release(providers.gradleProperty("compileSdkVersion").get().toInteger()) {
            minorApiLevel = providers.gradleProperty("compileSdkMinorVersion").get().toInteger()
        }
    }
    buildToolsVersion = providers.gradleProperty("buildToolsVersion").get()
    ndkVersion = providers.gradleProperty("ndkVersion").get()

    defaultConfig {
        minSdk = providers.gradleProperty("minSdkVersion").get().toInteger()
        ndk {
            abiFilters.addAll(rootProject.ext.foldProfile.supportedAbis)
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path = file('src/main/cpp/Android.mk')
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.annotation:annotation:$annotationVersion"
    implementation "androidx.core:core:$coreVersion"
    implementation "com.google.android.material:material:$materialVersion"
    // Public property schemas expose Guava map types; MoreFiles needs the JRE variant.
    api "com.google.guava:guava:33.7.2-jre"
    implementation "io.noties.markwon:core:$markwonVersion"
    implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
    implementation "io.noties.markwon:linkify:$markwonVersion"
    implementation "io.noties.markwon:recycler:$markwonVersion"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.2"
    implementation "androidx.window:window:1.5.1"
    implementation "commons-io:commons-io:2.22.0"
    implementation "com.termux:termux-am-library:v2.0.0"
    implementation project(":terminal-view")

    testImplementation "junit:junit:4.13.2"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugarVersion"
}
