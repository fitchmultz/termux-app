plugins {
    id "com.android.application"
}

def profile = rootProject.ext.foldProfile
ext.packageVariant = profile.packageVariant
def bootstrapDirectory = layout.buildDirectory.dir("bootstrap")

android {
    namespace = "com.termux"
    compileSdk = providers.gradleProperty("compileSdkVersion").get().toInteger()
    buildToolsVersion = providers.gradleProperty("buildToolsVersion").get()
    ndkVersion = providers.gradleProperty("ndkVersion").get()

    defaultConfig {
        minSdk = providers.gradleProperty("minSdkVersion").get().toInteger()
        targetSdk = providers.gradleProperty("targetSdkVersion").get().toInteger()
        versionCode = profile.versionCode
        versionName = profile.versionName
        resValue "string", "application_name", profile.applicationLabel
        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"${project.ext.packageVariant}\""

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = profile.applicationLabel
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        ndk {
            abiFilters.addAll(profile.supportedAbis)
        }
        externalNativeBuild {
            ndkBuild {
                arguments.add("FOLD_BOOTSTRAP_DIR=${bootstrapDirectory.get().asFile}")
                cFlags.addAll(["-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"])
            }
        }
    }

    signingConfigs {
        debug {
            storeFile = file('testkey_untrusted.jks')
            keyAlias = 'alias'
            storePassword = 'xrj45yWGLbsO7W0v'
            keyPassword = 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/cpp/Android.mk")
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric's Android 17 FileDescriptor bridge calls this JDK internal API.
                jvmArgs("--add-exports=java.base/jdk.internal.access=ALL-UNNAMED")
                testLogging.exceptionFormat = "full"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }
}

dependencies {
    implementation "androidx.annotation:annotation:$annotationVersion"
    implementation "androidx.core:core:$coreVersion"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.viewpager:viewpager:1.1.0"
    implementation "com.google.android.material:material:$materialVersion"
    implementation project(":terminal-view")
    implementation project(":termux-shared")

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugarVersion"
}

tasks.register("versionName") {
    doLast {
        print android.defaultConfig.versionName
    }
}

tasks.register("foldReleaseMetadata") {
    doLast {
        println "versionName=${android.defaultConfig.versionName}"
        println "versionCode=${android.defaultConfig.versionCode}"
        println "applicationLabel=${android.defaultConfig.manifestPlaceholders.TERMUX_APP_NAME}"
        println "packageVariant=${profile.packageVariant}"
        println "supportedAbis=${profile.supportedAbis.join(',')}"
    }
}

// Always revalidate cached inputs and the generated payload, including on incremental builds.
// No mutable apt index or first-launch package download participates in APK builds.
def generateBootstrap = tasks.register("generateBootstrap", Exec) {
    workingDir rootProject.projectDir
    commandLine "python3", rootProject.file("tools/bootstrap/bootstrap.py").absolutePath,
        "build", "--cache", bootstrapDirectory.get().dir("downloads").asFile.absolutePath,
        "--output", bootstrapDirectory.get().file("bootstrap-aarch64.zip").asFile.absolutePath
}

// Both native and Java compilation need the verified bootstrap archive.
tasks.named("preBuild") {
    dependsOn(generateBootstrap)
}
