plugins {
    id 'com.android.library'
}

android {
    namespace = "com.termux.emulator"
    compileSdk = providers.gradleProperty("compileSdkVersion").get().toInteger()
    buildToolsVersion = providers.gradleProperty("buildToolsVersion").get()
    ndkVersion = providers.gradleProperty("ndkVersion").get()

    defaultConfig {
        minSdk = providers.gradleProperty("minSdkVersion").get().toInteger()
        ndk {
            abiFilters.addAll(rootProject.ext.foldProfile.supportedAbis)
        }
        externalNativeBuild {
            ndkBuild {
                cFlags.addAll(["-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"])
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:$annotationVersion"
    testImplementation "junit:junit:4.13.2"
}
